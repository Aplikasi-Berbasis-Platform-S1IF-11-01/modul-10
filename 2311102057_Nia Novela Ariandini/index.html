<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil AJAX - Novel</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fff0f6, #ffe4ec);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            padding: 35px 30px;
            border-radius: 20px;
            width: 350px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(255, 105, 180, 0.2);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        h1 {
            color: #d63384;
            margin-bottom: 10px;
            font-size: 24px;
        }

        p.subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
        }

        button {
            background: linear-gradient(135deg, #ff8fab, #ff5c8a);
            border: none;
            padding: 12px 20px;
            color: white;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(255, 105, 180, 0.3);
        }

        #hasil-profil {
            margin-top: 25px;
            padding: 15px;
            border-radius: 12px;
            background: #fff0f6;
            color: #444;
            font-size: 14px;
            line-height: 1.6;
            display: none;
        }

        .fade-in {
            animation: fadeIn 0.6s ease forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Profil Saya</h1>
        <p class="subtitle">Klik tombol untuk menampilkan data</p>

        <button id="btnProfil">✨ Tampilkan Profil</button>

        <div id="hasil-profil"></div>
    </div>

    <script>
        document.getElementById("btnProfil").addEventListener("click", function() {
            fetch("data.php")
                .then(response => response.json())
                .then(data => {
                    const hasil = document.getElementById("hasil-profil");

                    hasil.style.display = "block";
                    hasil.classList.add("fade-in");

                    hasil.innerHTML = `
                        💖 <b>Nama :</b> ${data.nama} <br>
                        💼 <b>Pekerjaan :</b> ${data.pekerjaan} <br>
                        📍 <b>Lokasi :</b> ${data.lokasi}
                    `;
                })
                .catch(error => {
                    document.getElementById("hasil-profil").innerHTML = "Gagal ambil data 😢";
                    console.error(error);
                });
        });
    </script>

</body>
</html>
