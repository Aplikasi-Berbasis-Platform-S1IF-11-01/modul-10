<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium AJAX Interface</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap');

        :root {
            --primary: #b91c1c;
            --dark: #1e293b;
            --light: #f8fafc;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            /* Ornamen Background Geometris Halus */
            background-image: 
                linear-gradient(30deg, #b91c1c05 12%, transparent 12.5%, transparent 87%, #b91c1c05 87.5%, #b91c1c05),
                linear-gradient(150deg, #b91c1c05 12%, transparent 12.5%, transparent 87%, #b91c1c05 87.5%, #b91c1c05),
                linear-gradient(30deg, #b91c1c05 12%, transparent 12.5%, transparent 87%, #b91c1c05 87.5%, #b91c1c05),
                linear-gradient(150deg, #b91c1c05 12%, transparent 12.5%, transparent 87%, #b91c1c05 87.5%, #b91c1c05),
                linear-gradient(60deg, #b91c1c0a 25%, transparent 25.5%, transparent 75%, #b91c1c0a 75%, #b91c1c0a),
                linear-gradient(60deg, #b91c1c0a 25%, transparent 25.5%, transparent 75%, #b91c1c0a 75%, #b91c1c0a);
            background-size: 80px 140px;
        }

        .main-card {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 50px 40px;
            border-radius: 30px;
            box-shadow: 0 25px 50px -12px rgba(185, 28, 28, 0.15);
            text-align: center;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* Ornamen Garis Atas */
        .main-card::before {
            content: "";
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 100px; height: 5px;
            background: var(--primary);
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            color: var(--dark);
            font-size: 2rem;
            margin: 0 0 10px 0;
        }

        .decorator {
            color: var(--primary);
            letter-spacing: 5px;
            font-size: 0.8rem;
            margin-bottom: 25px;
            opacity: 0.6;
        }

        #btn-fetch {
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px 35px;
            border-radius: 50px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(185, 28, 28, 0.2);
        }

        #btn-fetch:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 25px rgba(185, 28, 28, 0.3);
            background: #991b1b;
        }

        /* Hasil Profil dengan Efek Card */
        #profile-result {
            margin-top: 40px;
            text-align: left;
            padding: 25px;
            background: #fffafa;
            border-radius: 20px;
            border: 1px solid rgba(185, 28, 28, 0.1);
            display: none;
            animation: slideUp 0.6s ease forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .info-row {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
        }

        .info-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--primary);
            width: 100px;
            letter-spacing: 1px;
        }

        .info-value {
            font-size: 0.95rem;
            color: var(--dark);
            font-weight: 500;
        }

        /* Badge Status */
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            background: #dcfce7;
            color: #166534;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <h2>Identity Hub</h2>
        <div class="decorator">✦ ✦ ✦</div>
        
        <button id="btn-fetch">Fetch Profile</button>

        <div id="profile-result">
            </div>
    </div>

    <script>
        const btn = document.getElementById('btn-fetch');
        const resultBox = document.getElementById('profile-result');

        btn.addEventListener('click', () => {
            btn.innerHTML = "Processing...";
            btn.style.opacity = "0.7";

            fetch('data.php')
                .then(res => res.json())
                .then(data => {
                    resultBox.innerHTML = `
                        <div class="info-row">
                            <span class="info-label">Full Name</span>
                            <span class="info-value">${data.nama}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Role</span>
                            <span class="info-value">${data.pekerjaan}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Location</span>
                            <span class="info-value">${data.lokasi}</span>
                        </div>
                        <span class="status-badge">● ${data.status}</span>
                    `;
                    
                    resultBox.style.display = 'block';
                    btn.innerHTML = "Update Data";
                    btn.style.opacity = "1";
                })
                .catch(err => {
                    alert("Gagal memuat data server.");
                    btn.innerHTML = "Retry Fetch";
                    btn.style.opacity = "1";
                });
        });
    </script>
</body>
</html>
