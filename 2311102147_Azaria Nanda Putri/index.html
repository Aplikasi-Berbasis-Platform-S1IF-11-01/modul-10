<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modul 10 — AJAX Profil</title>
    <style>
        /* === Reset & Base === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f1117;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* === Container Utama === */
        .container {
            width: 100%;
            max-width: 700px;
        }

        /* === Header === */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header .badge {
            display: inline-block;
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            color: white;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 5px 16px;
            border-radius: 20px;
            margin-bottom: 16px;
        }

        .header h1 {
            font-size: 30px;
            font-weight: 800;
            background: linear-gradient(135deg, #e2e8f0, #67e8f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 13px;
            color: #64748b;
        }

        .header p span {
            color: #94a3b8;
            font-weight: 600;
        }

        /* === Tombol === */
        .btn-tampilkan {
            display: block;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #0891b2, #2563eb);
            color: white;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: opacity 0.2s, transform 0.15s;
            margin-bottom: 28px;
        }

        .btn-tampilkan:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-tampilkan:active {
            transform: translateY(0);
            opacity: 1;
        }

        /* === Loading Indicator === */
        .loading {
            text-align: center;
            padding: 24px;
            color: #64748b;
            font-size: 14px;
            display: none; /* Disembunyikan awal */
        }

        .loading-dot {
            display: inline-block;
            animation: blink 1.2s infinite;
        }

        .loading-dot:nth-child(2) { animation-delay: 0.2s; }
        .loading-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0.2; }
            40%            { opacity: 1; }
        }

        /* === Area Hasil Profil === */
        #hasil-profil {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* === Kartu Profil === */
        .profil-card {
            background: #1e2130;
            border: 1px solid #2d3148;
            border-radius: 14px;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            animation: fadeIn 0.4s ease both;
        }

        /* Stagger animasi per kartu */
        .profil-card:nth-child(1) { animation-delay: 0.05s; }
        .profil-card:nth-child(2) { animation-delay: 0.15s; }
        .profil-card:nth-child(3) { animation-delay: 0.25s; }
        .profil-card:nth-child(4) { animation-delay: 0.35s; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Avatar inisial nama */
        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: linear-gradient(135deg, #0891b2, #2563eb);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 800;
            color: white;
            flex-shrink: 0;
        }

        .profil-info {
            flex: 1;
        }

        .profil-nama {
            font-size: 16px;
            font-weight: 700;
            color: #e2e8f0;
            margin-bottom: 4px;
        }

        .profil-detail {
            font-size: 13px;
            color: #64748b;
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
        }

        .profil-detail .item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .profil-detail .icon {
            font-size: 14px;
        }

        /* === Pesan Error === */
        .error-msg {
            background: #3b1515;
            border: 1px solid #991b1b;
            color: #f87171;
            padding: 16px 20px;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
        }

        /* === Footer === */
        .footer {
            text-align: center;
            margin-top: 36px;
            font-size: 12px;
            color: #374151;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Header -->
    <div class="header">
        <div class="badge">Modul 10 — AJAX</div>
        <h1>Direktori Profil</h1>
        <p>Nama: <span>Azaria Nanda Putri</span> &nbsp;|&nbsp; NIM: <span>2311102147</span></p>
    </div>

    <!-- Tombol Tampilkan Profil -->
    <button class="btn-tampilkan" onclick="tampilkanProfil()">
        ⚡ Tampilkan Profil
    </button>

    <!-- Indikator Loading -->
    <div class="loading" id="loading">
        Mengambil data
        <span class="loading-dot">.</span>
        <span class="loading-dot">.</span>
        <span class="loading-dot">.</span>
    </div>

    <!-- Div tempat hasil AJAX ditampilkan -->
    <div id="hasil-profil"></div>

    <!-- Footer -->
    <div class="footer">
        Praktikum Pemrograman Web &mdash; Azaria Nanda Putri / 2311102147
    </div>

</div>

<script>
    /**
     * Fungsi: tampilkanProfil()
     * Mengambil data dari data.php menggunakan fetch() (AJAX),
     * lalu menampilkan hasilnya ke dalam div#hasil-profil.
     */
    function tampilkanProfil() {
        const hasilDiv  = document.getElementById('hasil-profil');
        const loadingEl = document.getElementById('loading');

        // Kosongkan hasil sebelumnya & tampilkan loading
        hasilDiv.innerHTML = '';
        loadingEl.style.display = 'block';

        // Fetch data dari data.php (AJAX request)
        fetch('data.php')
            .then(function(response) {
                // Periksa apakah request berhasil
                if (!response.ok) {
                    throw new Error('Gagal mengambil data: ' + response.status);
                }
                // Ubah response menjadi JSON
                return response.json();
            })
            .then(function(data) {
                // Sembunyikan loading
                loadingEl.style.display = 'none';

                // Loop melalui semua data profil dan tampilkan
                data.forEach(function(orang) {
                    // Ambil inisial nama untuk avatar
                    const inisial = orang.nama
                        .split(' ')
                        .map(function(kata) { return kata[0]; })
                        .slice(0, 2)
                        .join('');

                    // Buat elemen kartu profil
                    const card = document.createElement('div');
                    card.className = 'profil-card';

                    // Isi HTML kartu
                    card.innerHTML = `
                        <div class="avatar">${inisial}</div>
                        <div class="profil-info">
                            <div class="profil-nama">${orang.nama}</div>
                            <div class="profil-detail">
                                <span class="item">
                                    <span class="icon">💼</span>
                                    Pekerjaan: ${orang.pekerjaan}
                                </span>
                                <span class="item">
                                    <span class="icon">📍</span>
                                    Lokasi: ${orang.lokasi}
                                </span>
                            </div>
                        </div>
                    `;

                    // Tambahkan kartu ke dalam div hasil
                    hasilDiv.appendChild(card);
                });
            })
            .catch(function(error) {
                // Tampilkan pesan error jika ada masalah
                loadingEl.style.display = 'none';
                hasilDiv.innerHTML = `
                    <div class="error-msg">
                        ❌ Error: ${error.message}<br>
                        Pastikan file data.php ada dan server berjalan (XAMPP/Laragon).
                    </div>
                `;
            });
    }
</script>

</body>
</html>
