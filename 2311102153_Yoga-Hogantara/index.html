<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modul 10 – AJAX</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      color: #e8e4dc;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
    }

    h1 {
      font-size: 1.2rem;
      font-weight: 600;
      color: #e8e4dc;
      margin-bottom: .4rem;
    }

    p.sub {
      font-size: .8rem;
      color: #666;
      margin-bottom: 2rem;
    }

    button {
      width: 100%;
      padding: .75rem;
      background: #e8e4dc;
      color: #111;
      border: none;
      border-radius: 5px;
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s;
      margin-bottom: 1.5rem;
    }

    button:hover { opacity: .85; }
    button:disabled { opacity: .5; cursor: not-allowed; }

    #hasil-profil {
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 5px;
      padding: 1.2rem;
      font-size: .85rem;
      color: #888;
      min-height: 56px;
      line-height: 1.8;
    }

    #hasil-profil.loaded {
      color: #e8e4dc;
      border-color: #3a3a3a;
    }

    #hasil-profil span {
      color: #aaa;
    }

    .error { color: #e07070 !important; }
  </style>
</head>
<body>

<div class="card">
  <h1>Profil Pengguna</h1>
  <p class="sub">Data diambil dari server tanpa reload halaman.</p>

  <button id="btn">Tampilkan Profil</button>

  <div id="hasil-profil">Belum ada data.</div>
</div>

<script>
  const btn   = document.getElementById('btn');
  const hasil = document.getElementById('hasil-profil');

  btn.addEventListener('click', async () => {
    btn.disabled = true;
    btn.textContent = 'Mengambil data...';
    hasil.className = '';
    hasil.textContent = 'Memuat...';

    try {
      const res  = await fetch('data.php');
      if (!res.ok) throw new Error('Gagal terhubung ke server.');
      const data = await res.json();

      hasil.className = 'loaded';
      hasil.innerHTML =
        `<span>Nama:</span> ${data.nama} &nbsp;|&nbsp; ` +
        `<span>Pekerjaan:</span> ${data.pekerjaan} &nbsp;|&nbsp; ` +
        `<span>Lokasi:</span> ${data.lokasi}`;

    } catch (err) {
      hasil.className = 'error';
      hasil.textContent = '⚠ ' + err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Tampilkan Profil';
    }
  });
</script>

</body>
</html>
