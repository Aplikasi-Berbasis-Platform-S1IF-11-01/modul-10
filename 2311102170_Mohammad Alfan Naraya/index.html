<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Alfan - Modul10</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #0f172a;       /* Slate Dark */
            --card-surface: #1e293b;  /* Slate Medium */
            --accent-blue: #38bdf8;   /* Sky Blue */
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.05) 0px, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            color: var(--text-primary);
        }

        .profile-card {
            background: var(--card-surface);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 28px;
            padding: 3.5rem 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .icon-circle {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-blue);
            width: 64px;
            height: 64px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .instruction {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 2.5rem;
            line-height: 1.5;
        }

        /* Tombol Sesuai Permintaan: Teks Tetap "Tampilkan Profil" */
        .btn-main {
            background-color: var(--accent-blue);
            color: var(--bg-deep);
            border: none;
            border-radius: 14px;
            padding: 14px 28px;
            font-weight: 600;
            font-size: 0.95rem;
            width: 100%;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-main:hover {
            background-color: #7dd3fc;
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -5px rgba(56, 189, 248, 0.3);
        }

        .btn-main:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        #hasil-profil {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: none;
            animation: reveal 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes reveal {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
        }

        .info-item:last-child { margin-bottom: 0; }

        .label {
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 600;
        }

        .value {
            font-size: 1rem;
            color: var(--text-primary);
        }

        .spinner-border {
            width: 1.1rem;
            height: 1.1rem;
            margin-right: 10px;
            display: none;
            vertical-align: middle;
        }
    </style>
</head>
<body>

<div class="profile-card">
    <div class="icon-circle">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" viewBox="0 0 16 16">
            <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4zm-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10c-2.29 0-3.516.68-4.168 1.332-.678.678-.83 1.418-.832 1.664h10z"/>
        </svg>
    </div>

    <h2>Manajemen Profil</h2>
    <p class="instruction">Klik tombol di bawah untuk memuat data profil</p>

    <button id="btn-tampil" class="btn-main">
        <div class="spinner-border spinner-border-sm" role="status"></div>
        <span>Tampilkan Profil</span>
    </button>

    <div id="hasil-profil">
        <div class="info-item">
            <span class="label">Nama</span>
            <span id="p-nama" class="value">-</span>
        </div>
        <div class="info-item">
            <span class="label">Pekerjaan</span>
            <span id="p-pekerjaan" class="value">-</span>
        </div>
        <div class="info-item">
            <span class="label">Lokasi</span>
            <span id="p-lokasi" class="value">-</span>
        </div>
    </div>
</div>

<script>
    const btn = document.getElementById('btn-tampil');
    const loader = btn.querySelector('.spinner-border');
    const hasilDiv = document.getElementById('hasil-profil');

    btn.addEventListener('click', function() {
        btn.disabled = true;
        loader.style.display = 'inline-block';
        
        fetch('data.php')
            .then(response => response.json())
            .then(data => {
                // Delay kecil untuk estetika loading
                setTimeout(() => {
                    document.getElementById('p-nama').innerText = data.nama;
                    document.getElementById('p-pekerjaan').innerText = data.pekerjaan;
                    document.getElementById('p-lokasi').innerText = data.lokasi;

                    hasilDiv.style.display = 'block';
                    btn.disabled = false;
                    loader.style.display = 'none';
                }, 600);
            })
            .catch(error => {
                alert("Koneksi gagal.");
                btn.disabled = false;
                loader.style.display = 'none';
            });
    });
</script>

</body>
</html>
