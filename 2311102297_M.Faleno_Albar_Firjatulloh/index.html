<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profil Team — AJAX Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0f14;
      --surface:   #161920;
      --border:    #252830;
      --accent:    #e8ff5a;
      --accent2:   #5affcd;
      --text:      #e8eaf0;
      --muted:     #6b7080;
      --danger:    #ff5a7a;
    }

    body {
      font-family: 'Syne', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: .4;
      pointer-events: none;
    }

    .wrapper {
      width: 100%;
      max-width: 700px;
      position: relative;
      z-index: 1;
    }

    .header {
      margin-bottom: 3rem;
    }
    .tag {
      display: inline-block;
      font-family: 'DM Mono', monospace;
      font-size: .7rem;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: .25rem .65rem;
      border-radius: 2px;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -.02em;
    }
    h1 span { color: var(--accent); }
    .subtitle {
      margin-top: .75rem;
      color: var(--muted);
      font-size: .95rem;
      font-weight: 400;
      line-height: 1.6;
    }

    #btn-fetch {
      margin-top: 2rem;
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      background: var(--accent);
      color: #0d0f14;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: .95rem;
      letter-spacing: .03em;
      border: none;
      padding: .85rem 1.8rem;
      cursor: pointer;
      border-radius: 4px;
      transition: transform .15s, box-shadow .15s;
      position: relative;
      overflow: hidden;
    }
    #btn-fetch::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,.15);
      opacity: 0;
      transition: opacity .2s;
    }
    #btn-fetch:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(232,255,90,.25); }
    #btn-fetch:hover::after { opacity: 1; }
    #btn-fetch:active { transform: translateY(0); }
    #btn-fetch:disabled { opacity: .5; cursor: not-allowed; }

    .btn-icon { font-size: 1rem; transition: transform .3s; }
    #btn-fetch:hover .btn-icon { transform: rotate(20deg); }

    #hasil-profil {
      margin-top: 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.25rem;
      opacity: 0;
      transform: translateY(16px);
      animation: slideIn .4s forwards;
    }
    @keyframes slideIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1rem;
      color: #0d0f14;
      flex-shrink: 0;
    }

    .card-body { flex: 1; min-width: 0; }
    .card-nama {
      font-size: 1rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-detail {
      margin-top: .35rem;
      font-family: 'DM Mono', monospace;
      font-size: .75rem;
      color: var(--muted);
    }
    .card-detail .sep { margin: 0 .5rem; color: var(--border); }
    .pill {
      display: inline-block;
      background: rgba(90,255,205,.08);
      color: var(--accent2);
      border: 1px solid rgba(90,255,205,.2);
      padding: .15rem .55rem;
      border-radius: 999px;
      font-size: .7rem;
      font-family: 'DM Mono', monospace;
    }

    .status {
      font-family: 'DM Mono', monospace;
      font-size: .8rem;
      padding: 1rem 1.25rem;
      border-radius: 6px;
      border-left: 3px solid;
    }
    .status.loading { border-color: var(--accent);  color: var(--accent);  background: rgba(232,255,90,.05); }
    .status.error   { border-color: var(--danger);  color: var(--danger);  background: rgba(255,90,122,.05); }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      margin: 2rem 0 0;
    }
    .note {
      margin-top: 1rem;
      font-family: 'DM Mono', monospace;
      font-size: .7rem;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
<div class="wrapper">

  <div class="header">
    <div class="tag">⚡ AJAX Demo</div>
    <h1>Data Tim<br/><span>Tanpa Reload</span></h1>
    <p class="subtitle">
      Klik tombol di bawah untuk mengambil data profil dari <code>data.php</code>
      menggunakan <strong>fetch()</strong> API — halaman tidak akan di-reload.
    </p>

    <button id="btn-fetch">
      <span class="btn-icon">⬇</span>
      Tampilkan Profil
    </button>
  </div>

  <div id="hasil-profil"></div>

  <div class="divider"></div>
  <p class="note">// data diambil dari data.php via HTTP GET · tidak ada page reload</p>

</div>

<script>
  const btn    = document.getElementById('btn-fetch');
  const hasil  = document.getElementById('hasil-profil');

  btn.addEventListener('click', async () => {
    hasil.innerHTML = '<div class="status loading">⏳ Mengambil data dari server…</div>';
    btn.disabled = true;

    try {
      const response = await fetch('data.php');

      if (!response.ok) {
        throw new Error(`HTTP error! Status: ${response.status}`);
      }

      const data = await response.json();

      hasil.innerHTML = '';

      data.forEach((profil, i) => {
        const inisial = profil.nama.split(' ').map(w => w[0]).join('').slice(0, 2);

        const card = document.createElement('div');
        card.className = 'card';
        card.style.animationDelay = `${i * 80}ms`;

        card.innerHTML = `
          <div class="avatar">${inisial}</div>
          <div class="card-body">
            <div class="card-nama">${profil.nama}</div>
            <div class="card-detail">
              Nama: <strong style="color:var(--text)">${profil.nama}</strong>
              <span class="sep">|</span>
              Pekerjaan: <strong style="color:var(--text)">${profil.pekerjaan}</strong>
              <span class="sep">|</span>
              Lokasi: <strong style="color:var(--text)">${profil.lokasi}</strong>
            </div>
          </div>
          <span class="pill">${profil.lokasi}</span>
        `;

        hasil.appendChild(card);
      });

      btn.textContent = '✓ Data Berhasil Dimuat';

    } catch (err) {
      hasil.innerHTML = `
        <div class="status error">
          ✗ Gagal mengambil data: ${err.message}<br/>
          <small>Pastikan file data.php berjalan di server PHP (misal: XAMPP / localhost).</small>
        </div>`;
      btn.disabled = false;
      btn.innerHTML = '<span class="btn-icon">↻</span> Coba Lagi';
    }
  });
</script>
</body>
</html>
